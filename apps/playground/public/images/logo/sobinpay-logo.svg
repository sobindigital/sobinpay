<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 90" width="380" height="90">
  <defs>
    <linearGradient id="sobinGradHoriz" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#3B82F6" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Left Icon Mark -->
  <g transform="translate(10, 8)" filter="url(#iconGlow)">
    <rect width="74" height="74" rx="20" fill="#0A0E1A" stroke="rgba(255,255,255,0.12)" stroke-width="1.2" />
    <path
      d="M48 20 H30 C23 20 18 25 18 32 C18 39 23 44 30 44 H44 C51 44 56 49 56 56 C56 63 51 68 44 68 H26"
      fill="none"
      stroke="url(#sobinGradHoriz)"
      stroke-width="8"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <path
      d="M41 27 L31 44 H42 L33 58"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="3"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>

  <!-- Typography: SOBINPAY -->
  <g transform="translate(102, 48)">
    <!-- Sobin in crisp white -->
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-weight="800" font-size="34" letter-spacing="-0.5" fill="#FFFFFF">
      Sobin
    </text>
    <!-- Pay in gradient electric cyan/blue -->
    <text x="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-weight="800" font-size="34" letter-spacing="-0.5" fill="url(#textGrad)">
      Pay
    </text>
  </g>

  <!-- Subtitle: by Sobin Digital -->
  <g transform="translate(104, 70)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-weight="600" font-size="11.5" letter-spacing="1.2" fill="#94A3B8" text-transform="uppercase">
      BY SOBIN DIGITAL
    </text>
    <!-- Lightning Dot -->
    <circle cx="214" cy="-3.5" r="3" fill="#00F2FE" />
  </g>
</svg>

